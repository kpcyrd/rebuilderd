[workspace]
members = [
    "common",
    "daemon",
    "tests",
    "tools",
    "worker",
]
resolver = "2"

[workspace.dependencies]
actix-web = { version = "4", default-features = false, features = [
  "macros",
  "compress-gzip",
  "compress-zstd",
  "unicode",
  "compat",
] }
rand = "0.10"
rebuilderd = { version = "=0.29.0", path = "daemon" }
rebuilderd-common = { version = "=0.28.1", path = "common" }
toml = "1"
zstd = { version = "0.14", features = ["pkg-config"] }
